<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daan Zunnenberg</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f7f3;
    --card-bg: #0d1726;
    --green: #1f7a5c;
    --green-dim: #163f30;
    --red: #a23a44;
    --red-dim: #4a2429;
    --cyan: #9fb0c9;
    --amber: #b7a066;
    --text: #f3f1ea;
    --dim: #9aa4b2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 100vh;
  }

  .bg-grain {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 180px 180px;
    opacity: 0.035;
    mix-blend-mode: multiply;
  }

  .frame {
    position: relative;
    z-index: 1;
    width: min(78vw, 148vh, 900px);
    aspect-ratio: 1.75 / 1;
    border-radius: clamp(6px, 0.9vw, 10px);
    padding: 2px;
    background: linear-gradient(150deg, rgba(183,160,102,0.55), rgba(183,160,102,0.16) 40%, rgba(0,0,0,0) 60%, rgba(183,160,102,0.28) 100%);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: clamp(5px, 0.8vw, 9px);
    background: var(--card-bg);
    overflow: hidden;
  }

  .card-bg {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    overflow: hidden;
    z-index: 0;
    background:
      radial-gradient(140% 120% at 88% -10%, rgba(183,160,102,0.16) 0%, rgba(183,160,102,0) 45%),
      radial-gradient(90% 90% at 10% 110%, rgba(35,50,79,0.55) 0%, rgba(35,50,79,0) 55%),
      linear-gradient(122deg, #0a1220 0%, #0d1726 42%, #141d33 78%, #0d1726 100%);
  }

  /* Fine hairline grid, the same restrained "market data" texture as the
     rest of the site, kept purely decorative and static here. */
  .card-bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(220,223,230,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(220,223,230,0.05) 1px, transparent 1px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(120% 100% at 82% 20%, #000 0%, rgba(0,0,0,0.5) 45%, transparent 78%);
            mask-image: radial-gradient(120% 100% at 82% 20%, #000 0%, rgba(0,0,0,0.5) 45%, transparent 78%);
  }

  /* Slow gold sheen drifting across the panel: the one piece of motion,
     kept subtle and continuous rather than data-driven. */
  .sheen {
    position: absolute;
    inset: -20%;
    z-index: 1;
    background: linear-gradient(100deg, transparent 42%, rgba(183,160,102,0.14) 50%, transparent 58%);
    background-size: 220% 220%;
    background-position: 0% 0%;
    animation: sheen-drift 14s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes sheen-drift {
    0%, 100% { background-position: 0% 0%; }
    50% { background-position: 100% 60%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sheen { animation: none; background-position: 60% 20%; }
  }

  /* Oversized monogram watermark, echoing the site-wide footer mark. */
  .monogram {
    position: absolute;
    z-index: 1;
    right: clamp(-6%, -2vw, 2%);
    bottom: clamp(-14%, -6vw, -4%);
    width: clamp(220px, 34vw, 420px);
    height: auto;
    opacity: 0.5;
    pointer-events: none;
  }
  .monogram text {
    font-family: 'IBM Plex Serif', Georgia, serif;
    font-weight: 600;
  }

  .scrim {
    position: absolute;
    inset: 0;
    z-index: 2;
    background:
      linear-gradient(78deg, rgba(13,23,38,1) 0%, rgba(13,23,38,0.97) 34%, rgba(13,23,38,0.86) 50%, rgba(13,23,38,0.48) 66%, rgba(13,23,38,0.16) 82%, rgba(13,23,38,0.05) 100%);
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 4;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 clamp(22px, 5vw, 56px);
    max-width: 76%;
  }

  .eyebrow {
    font-size: clamp(11px, 1.3vw, 15px);
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #dcdfe6;
    margin: 0 0 clamp(8px, 1.3vw, 15px);
  }

  h1 {
    font-family: 'IBM Plex Serif', Georgia, serif;
    font-weight: 600;
    font-size: clamp(26px, 4.6vw, 48px);
    color: var(--text);
    margin: 0;
    line-height: 1.05;
    letter-spacing: -0.01em;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0.22em;
  }

  .desc {
    font-family: 'IBM Plex Serif', Georgia, serif;
    font-style: italic;
    font-size: clamp(13px, 1.5vw, 17px);
    line-height: 1.55;
    color: #9aa4b2;
    max-width: 34ch;
    margin: clamp(12px, 2vw, 22px) 0 clamp(18px, 3vw, 30px);
    font-weight: 400;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(8px, 1.3vw, 13px);
    align-self: flex-start;
    width: max-content;
    max-width: 100%;
    transition: opacity 0.15s ease;
  }
  .link {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #dcdfe6;
    text-decoration: none;
    font-family: inherit;
    font-size: clamp(12.5px, 1.4vw, 15.5px);
    font-weight: 500;
    position: relative;
    padding: clamp(8px, 1.3vw, 11px) clamp(11px, 1.6vw, 15px);
    border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.05);
    cursor: pointer;
    transition: border-color 0.35s cubic-bezier(0.16, 1, 0.3, 1), color 0.35s cubic-bezier(0.16, 1, 0.3, 1),
      background 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .content.revealed .links {
    flex-direction: column;
    align-self: stretch;
    width: 100%;
  }
  .content.revealed .link {
    justify-content: flex-start;
    width: 100%;
  }
  .content.revealed #scholar-link {
    display: none;
  }
  .content.reorg .links { opacity: 0; }
  .link:hover {
    border-color: rgba(159,176,201,0.6);
    color: var(--cyan);
    background: rgba(159,176,201,0.1);
  }
  .link svg { width: 16px; height: 16px; stroke: currentColor; flex-shrink: 0; }

  .site-link {
    align-self: flex-start;
    margin-bottom: clamp(10px, 1.6vw, 16px);
    justify-content: flex-start;
  }
  .site-link svg { width: 16px; height: 16px; stroke: currentColor; flex-shrink: 0; }

  .reveal-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    align-self: flex-start;
    margin: clamp(10px, 1.8vw, 18px) 0 0;
    cursor: pointer;
    user-select: none;
    color: var(--dim);
    font-size: clamp(10.5px, 1.1vw, 12px);
    font-family: inherit;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .card:hover .reveal-toggle,
  .reveal-toggle:focus-within {
    opacity: 1;
    pointer-events: auto;
  }
  .reveal-toggle .switch {
    position: relative;
    width: 34px;
    height: 19px;
    border-radius: 10px;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.2);
    transition: background 0.25s ease, border-color 0.25s ease;
    flex-shrink: 0;
  }
  .reveal-toggle .switch::after {
    content: "";
    position: absolute;
    top: 1px; left: 1px;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: #dcdfe6;
    transition: transform 0.25s cubic-bezier(.4,0,.2,1), background 0.25s ease;
  }
  .reveal-toggle input {
    position: absolute;
    opacity: 0;
    width: 0; height: 0;
  }
  .reveal-toggle input:checked ~ .switch {
    background: rgba(159,176,201,0.35);
    border-color: rgba(159,176,201,0.7);
  }
  .reveal-toggle input:checked ~ .switch::after {
    transform: translateX(15px);
    background: var(--cyan);
  }
  .reveal-toggle:hover { color: #9aa4b2; }

  .label-text {
    display: inline-block;
    transition: opacity 0.18s ease;
  }
  .label-text.swapping { opacity: 0; }

  .toast {
    position: absolute;
    top: -28px; left: 50%;
    transform: translate(-50%, 6px);
    font-size: 10px;
    color: var(--card-bg);
    background: var(--green);
    padding: 4px 8px;
    border-radius: 2px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    font-weight: 600;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 640px), (max-aspect-ratio: 3/4), (max-height: 500px) and (orientation: landscape) {
    body { align-items: flex-start; padding: 16px 0 24px; }
    .frame {
      width: min(92vw, 78vh, 460px);
      aspect-ratio: auto;
      height: min(560px, 82vh);
      background: linear-gradient(150deg, rgba(183,160,102,0.5), rgba(183,160,102,0.18) 10%, rgba(0,0,0,0) 22%);
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }
    .scrim { background: rgba(13, 23, 38, 0.55); }
    .monogram { opacity: 0.35; }
    .content {
      position: absolute;
      top: 0; left: 0; right: 0;
      min-height: 68%;
      height: auto;
      justify-content: center;
      max-width: 100%;
      padding: clamp(20px, 6vw, 32px);
      background: linear-gradient(180deg, var(--card-bg) 0%, var(--card-bg) 55%, rgba(13,23,38,0.75) 72%, rgba(13,23,38,0.35) 86%, rgba(13,23,38,0) 100%);
    }
    h1 {
      white-space: normal;
      font-size: clamp(24px, 8vw, 34px);
    }
    .desc { margin: clamp(10px, 3vw, 16px) 0 clamp(16px, 4vw, 22px); }
    .links { width: 100%; }
    .link { background: rgba(13,23,38,0.85); }
    .site-link { width: 100% !important; }
  }

  @media (max-height: 500px) and (orientation: landscape) {
    .content { padding: clamp(12px, 3vh, 20px) clamp(16px, 4vw, 24px); gap: 0; }
    .eyebrow { margin: 0 0 clamp(4px, 1vh, 8px); font-size: 10px; }
    h1 { font-size: clamp(18px, 5.4vh, 26px); }
    .desc { margin: clamp(4px, 1.4vh, 10px) 0 clamp(8px, 2vh, 14px); font-size: 12px; }
    .links { gap: 6px; }
    .link { padding: 6px 9px; font-size: 11px; }
    .link svg { width: 13px; height: 13px; }
    .site-link { margin-bottom: clamp(6px, 1.4vh, 10px); }
  }
</style>
</head>
<body>

<div class="bg-grain" aria-hidden="true"></div>

<div class="frame">
  <div class="card">
    <div class="card-bg">
      <div class="sheen" aria-hidden="true"></div>
      <svg class="monogram" viewBox="0 0 100 100" aria-hidden="true">
        <text x="100" y="78" text-anchor="end" font-size="92" fill="none" stroke="rgba(183,160,102,0.5)" stroke-width="0.6">DZ</text>
      </svg>
      <div class="scrim"></div>
    </div>

    <div class="content" id="content">
      <p class="eyebrow">Math PhD &middot; Quant Finance</p>
      <h1>Daan Zunnenberg</h1>
      <p class="desc">Probability, quantitative finance &amp; algorithmic trading.</p>

      <a class="link site-link" id="site-link" href="https://daanzunnenberg.com/">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <span class="label-text" data-short="Personal Website" data-long="daanzunnenberg.com">Personal Website</span>
      </a>

      <div class="links">
        <button type="button" class="link" id="email-link" data-u="dw.zunnenberg" data-d="gmail.com">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="m4 6 8 7 8-7"/></svg>
          <span class="label-text" data-short="Email">Email</span>
          <span class="toast" id="toast">Copied</span>
        </button>
        <a class="link" href="https://github.com/DaanZunnenberg" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
          <span class="label-text" data-short="GitHub" data-long="github.com/DaanZunnenberg">GitHub</span>
        </a>
        <a class="link" href="https://www.linkedin.com/in/daanzunnenberg/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 11v5M8 8v.01M12 16v-3a2 2 0 0 1 4 0v3M12 13v3"/></svg>
          <span class="label-text" data-short="LinkedIn" data-long="linkedin.com/in/daanzunnenberg">LinkedIn</span>
        </a>
        <a class="link" id="scholar-link" href="https://scholar.google.com/citations?user=JLg2KjEAAAAJ" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 4 2 10l10 6 10-6Z"/><path d="M6 12.5V17c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/></svg>
          <span class="label-text" data-short="Scholar" data-long="scholar.google.com/citations?user=JLg2KjEAAAAJ">Scholar</span>
        </a>
      </div>

      <label class="reveal-toggle">
        <input type="checkbox" id="reveal-checkbox">
        <span class="switch"></span>
        <span id="reveal-label">Show full links</span>
      </label>
    </div>
  </div>
</div>

<script>
  // ---- copy to clipboard ----
  const emailLink = document.getElementById('email-link');
  const toast = document.getElementById('toast');
  const emailAddress = emailLink.dataset.u + '@' + emailLink.dataset.d;
  // Built here instead of sitting as a data-long="..." attribute in the
  // markup, so the address isn't a plain string scrapers can read straight
  // out of the page source.
  emailLink.querySelector('.label-text').dataset.long = emailAddress;
  emailLink.addEventListener('click', async (e) => {
    e.preventDefault();
    try { await navigator.clipboard.writeText(emailAddress); }
    catch (err) {
      const ta = document.createElement('textarea');
      ta.value = emailAddress; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    }
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1300);
  });

  // ---- reveal toggle: crossfade each label between its short (icon-style)
  // text and its full contact-detail text, then re-sync the site-link width
  // once the new (likely wider) labels have settled. ----
  const revealCheckbox = document.getElementById('reveal-checkbox');
  const revealLabel = document.getElementById('reveal-label');
  const contentEl = document.getElementById('content');
  const labelTexts = document.querySelectorAll('.label-text');
  revealCheckbox.addEventListener('change', () => {
    const revealed = revealCheckbox.checked;
    revealLabel.textContent = revealed ? 'Show short labels' : 'Show full links';
    contentEl.classList.add('reorg');
    labelTexts.forEach((el) => {
      el.classList.add('swapping');
    });
    setTimeout(() => {
      labelTexts.forEach((el) => {
        el.textContent = revealed ? el.dataset.long : el.dataset.short;
        el.classList.remove('swapping');
      });
      contentEl.classList.toggle('revealed', revealed);
      requestAnimationFrame(() => {
        contentEl.classList.remove('reorg');
        syncSiteLinkWidth();
      });
    }, 180);
  });

  // ---- keep the website link's width matched to the icon-link row below,
  // so it "extends" but stops exactly where the last icon pill stops ----
  const siteLinkEl = document.getElementById('site-link');
  const linksRowEl = document.querySelector('.links');
  function syncSiteLinkWidth() {
    siteLinkEl.style.width = linksRowEl.getBoundingClientRect().width + 'px';
  }
  window.addEventListener('resize', syncSiteLinkWidth);
  window.addEventListener('load', syncSiteLinkWidth);
  syncSiteLinkWidth();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found &middot; {{ site.title }}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #f8f7f3;
      color: #14181f;
      font-family: "IBM Plex Serif", serif;
    }
    .error-404-panel {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      padding: 24px;
    }
    .error-404-code {
      font-family: monospace;
      font-size: 14px;
      letter-spacing: 0.08em;
      color: #797d84;
      margin: 0;
    }
    .error-404-panel h1 {
      margin: 0;
      font-size: 28px;
    }
    .error-404-panel p {
      color: #4b4f57;
      margin: 0;
    }
    .error-404-panel a {
      display: inline-block;
      margin-top: 8px;
      font-family: monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #f8f7f3;
      background: #23324f;
      border-radius: 2px;
      padding: 11px 22px;
      text-decoration: none;
    }
    .error-404-panel a:hover {
      background: #141d33;
    }
  </style>
</head>
<body>
  <section class="error-404-panel">
    <p class="error-404-code">404</p>
    <h1>Page Not Found</h1>
    <p>This page doesn't exist.</p>
    <a href="{{ '/' | relative_url }}">Back to Home</a>
  </section>
</body>
</html>
